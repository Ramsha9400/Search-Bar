<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modern SearchBar – Split Screen | @stackanddstyle</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a16;--panel:#0d1124;--line:rgba(255,255,255,.1);--text:#eef0ff;--muted:#9aa0c3;--accent:#7c5cff;--accent-2:#22d3ee}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px}
.brand{font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.brand small{color:var(--muted);font-weight:400;font-size:.8rem}
.dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--accent)}
.by{font-size:.82rem;color:var(--muted);padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.by b{color:var(--text);font-weight:600}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 28px 24px}
.pane{display:flex;flex-direction:column;min-height:0;border-radius:18px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.5)}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03);font-size:.8rem;color:var(--muted)}
.bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar span{margin-left:8px}
iframe{flex:1;border:0;width:100%;background:var(--bg)}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{font:500 .82rem 'Poppins',sans-serif;color:var(--muted);background:none;border:0;padding:8px 18px;border-radius:9px;cursor:pointer;transition:background .25s,color .25s}
.tab svg{width:17px;height:17px;margin-right:8px;vertical-align:-3px}.ic{display:flex;gap:7px}.ic svg{width:22px;height:22px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);background:rgba(255,255,255,.09);box-shadow:inset 0 -2px 0 var(--c)}
.tab[data-t=html]{--c:#ff7a45}.tab[data-t=css]{--c:#4da3ff}.tab[data-t=js]{--c:#f7d84a}
.file{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:.75rem}
#copy{font:500 .75rem 'Poppins',sans-serif;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);padding:6px 14px;border-radius:8px;cursor:pointer;transition:background .2s}
#copy:hover{background:rgba(124,92,255,.35)}
.codewrap{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#2c3260 transparent}
pre{padding:20px 22px;font:400 .8rem/1.7 'JetBrains Mono',ui-monospace,Consolas,monospace;tab-size:2;color:#d6d9f5}
.c{color:#5d6494;font-style:italic}.s{color:#9be08a}.k{color:#c792ff}.t{color:#ff7a8a}.a{color:#ffcb6b}.n{color:#f78c6c}.f{color:#6cc8ff}.p{color:#82aaff}
@media(max-width:900px){body{overflow:auto}.split{grid-template-columns:1fr;grid-auto-rows:80vh}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>Modern SearchBar <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 2l1.7 19L12 23l7.3-2L21 2z" fill="#e44d26"/><path d="M12 4v17.2l5.6-1.5L19.1 4z" fill="#f16529"/><text x="12" y="16" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" font-family="Poppins,sans-serif">5</text></svg><svg viewBox="0 0 24 24"><path d="M3 2l1.7 19L12 23l7.3-2L21 2z" fill="#1572b6"/><path d="M12 4v17.2l5.6-1.5L19.1 4z" fill="#33a9dc"/><text x="12" y="16" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" font-family="Poppins,sans-serif">3</text></svg><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3" fill="#f7df1e"/><text x="12.5" y="17" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle" font-family="Poppins,sans-serif">JS</text></svg></span></div>
  <div class="by">Created by <b>@stackanddstyle</b></div>
</header>
<main class="split">
  <section class="pane">
    <div class="bar"><i></i><i></i><i></i><span>Live Preview</span></div>
    <iframe id="demo" src="index.html" title="Modern SearchBar live demo"></iframe>
  </section>
  <section class="pane">
    <div class="bar"><i></i><i></i><i></i>
      <nav class="tabs" role="tablist">
        <button class="tab on" data-t="html" role="tab"><svg viewBox="0 0 24 24"><path d="M3 2l1.7 19L12 23l7.3-2L21 2z" fill="#e44d26"/><path d="M12 4v17.2l5.6-1.5L19.1 4z" fill="#f16529"/><text x="12" y="16" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" font-family="Poppins,sans-serif">5</text></svg>HTML</button>
        <button class="tab" data-t="css" role="tab"><svg viewBox="0 0 24 24"><path d="M3 2l1.7 19L12 23l7.3-2L21 2z" fill="#1572b6"/><path d="M12 4v17.2l5.6-1.5L19.1 4z" fill="#33a9dc"/><text x="12" y="16" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" font-family="Poppins,sans-serif">3</text></svg>CSS</button>
        <button class="tab" data-t="js" role="tab"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3" fill="#f7df1e"/><text x="12.5" y="17" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle" font-family="Poppins,sans-serif">JS</text></svg>JS</button>
      </nav>
      <span class="file" id="file">index.html</span>
      <button id="copy">Copy</button>
    </div>
    <div class="codewrap" id="wrap"><pre><code id="code"></code></pre></div>
  </section>
</main>
<script>
const SRC = {"html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Modern SearchBar | @stackanddstyle<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n  <link rel=\"stylesheet\" href=\"style.css\">\n<\/head>\n<body>\n  <main class=\"stage\">\n    <p class=\"kicker\">Modern SearchBar<\/p>\n\n    <form class=\"search-bar\" id=\"bar\" role=\"search\" autocomplete=\"off\">\n      <button type=\"button\" class=\"icon\" id=\"open\" aria-label=\"Open search\" aria-expanded=\"false\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M20 20l-3.6-3.6\"/>\n        <\/svg>\n      <\/button>\n      <input id=\"q\" type=\"text\" placeholder=\"Search...\" aria-label=\"Search\" tabindex=\"-1\">\n      <button type=\"button\" class=\"clear\" id=\"clear\" aria-label=\"Clear search\" tabindex=\"-1\">\n        <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\">\n          <path d=\"M6 6l12 12M18 6L6 18\"/>\n        <\/svg>\n      <\/button>\n    <\/form>\n\n    <p class=\"hint\" id=\"hint\">Click the icon or press <kbd>/<\/kbd><\/p>\n  <\/main>\n\n  <a class=\"credit\" href=\"#\">Created by <b>@stackanddstyle<\/b><\/a>\n  <script src=\"script.js\"><\/script>\n<\/body>\n<\/html>\n", "css": "/* ====== CHANGE COLORS HERE ====== */\n:root{\n  --bg:#eeedfb; --bg2:#fbfaff; --ink:#1d1b3a; --muted-ink:#6a6890;\n  --dark:#14123a; --dark-2:#2a2470;      /* search bar */\n  --text:#f4f3ff; --muted:#9c98d0;\n  --accent:#7c5cff; --accent-2:#22d3ee;\n}\n*{margin:0;padding:0;box-sizing:border-box}\nbody{\n  min-height:100vh;display:grid;place-items:center;color:var(--ink);\n  font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;\n  background:radial-gradient(900px 600px at 50% 0,var(--bg2),transparent 70%),var(--bg);\n}\n.stage{display:grid;justify-items:center;gap:26px;padding:24px}\n.kicker{font-weight:600;font-size:1.1rem;letter-spacing:.4px}\n.hint{font-size:.85rem;color:var(--muted-ink);min-height:1.3em}\nkbd{font:500 .72rem 'Poppins';padding:2px 9px;border-radius:7px;border:1px solid #d6d3f0;background:#fff;color:var(--muted-ink)}\n\n/* ====== THE SEARCH BAR ====== */\n.search-bar{\n  position:relative;width:70px;height:70px;border-radius:50px;overflow:hidden;\n  display:flex;align-items:center;\n  background:linear-gradient(135deg,var(--dark),var(--dark-2));\n  box-shadow:0 18px 40px rgba(30,20,90,.35);\n  transition:width .7s cubic-bezier(.5,-.4,.2,1.4),box-shadow .4s;   /* the springy expand */\n}\n.search-bar.active{width:min(440px,88vw)}\n.search-bar:focus-within{box-shadow:0 0 0 4px rgba(124,92,255,.28),0 18px 50px rgba(30,20,90,.42)}\n\n.icon{\n  flex:none;width:70px;height:70px;border:0;background:none;color:var(--text);cursor:pointer;\n  display:grid;place-items:center;transition:transform .45s cubic-bezier(.5,-.4,.2,1.8);\n}\n.icon svg{width:26px;height:26px}\n.search-bar:not(.active) .icon:hover{transform:scale(1.14) rotate(-8deg)}\n.icon:focus-visible{outline:2px solid var(--accent-2);outline-offset:-6px;border-radius:50%}\n\ninput{\n  flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);\n  font:400 1rem 'Poppins',sans-serif;caret-color:var(--accent-2);\n  opacity:0;transition:opacity .25s;\n}\ninput::placeholder{color:var(--muted)}\n.active input{opacity:1;transition-delay:.3s}\n\n.clear{\n  flex:none;width:44px;height:44px;margin-right:13px;border:0;border-radius:50%;cursor:pointer;\n  display:grid;place-items:center;color:var(--text);background:rgba(255,255,255,.08);\n  opacity:0;transform:scale(.5) rotate(-90deg);\n  transition:opacity .25s,transform .45s cubic-bezier(.5,-.4,.2,1.8),background .2s;\n}\n.active .clear{opacity:1;transform:none;transition-delay:.3s,.3s,0s}\n.clear:hover{background:rgba(255,255,255,.2)}\n.search-bar:not(.active) input,.search-bar:not(.active) .clear{pointer-events:none}\n\n.credit{\n  position:fixed;right:18px;bottom:16px;padding:8px 16px;border-radius:999px;text-decoration:none;font-size:.78rem;\n  color:var(--muted-ink);background:#fff;border:1px solid #e1dff5;\n}\n.credit b{color:var(--ink);font-weight:600}\n@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}\n", "js": "const bar = document.getElementById('bar');\nconst openBtn = document.getElementById('open');\nconst input = document.getElementById('q');\nconst clear = document.getElementById('clear');\nconst hint = document.getElementById('hint');\n\nconst isOpen = () => bar.classList.contains('active');\n\nfunction openBar() {\n  bar.classList.add('active');\n  openBtn.setAttribute('aria-expanded', 'true');\n  input.tabIndex = clear.tabIndex = 0;            // reachable by keyboard only when open\n  hint.innerHTML = 'Press <kbd>Esc<\/kbd> to close';\n  setTimeout(() => input.focus(), 350);           // wait for the bar to start growing\n}\n\nfunction closeBar() {\n  input.value = '';\n  bar.classList.remove('active');\n  openBtn.setAttribute('aria-expanded', 'false');\n  input.tabIndex = clear.tabIndex = -1;\n  input.blur();\n  hint.innerHTML = 'Click the icon or press <kbd>/<\/kbd>';\n}\n\nopenBtn.addEventListener('click', () => (isOpen() ? input.focus() : openBar()));\n\nclear.addEventListener('click', () => {           // 1st click clears the text, 2nd closes the bar\n  if (input.value) { input.value = ''; input.focus(); }\n  else closeBar();\n});\n\ninput.addEventListener('blur', () => {            // click outside with empty text = close\n  setTimeout(() => {\n    if (!input.value && !bar.contains(document.activeElement)) closeBar();\n  }, 150);\n});\n\nbar.addEventListener('submit', e => {\n  e.preventDefault();\n  hint.textContent = input.value ? `Searching for \"${input.value}\"...` : 'Type something first';\n});\n\naddEventListener('keydown', e => {\n  if (e.key === 'Escape' && isOpen()) closeBar();\n  if (e.key === '/' && !isOpen()) { e.preventDefault(); openBar(); }\n});\n"};
const FILES = {html:'index.html', css:'style.css', js:'script.js'};
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const RULES = {
  html: [/(<!--[\s\S]*?-->)|(<\/?[a-zA-Z][\w-]*)|("[^"]*")|(\s[\w:-]+(?==))|(\/?>)/g, ['c','t','s','a','t']],
  css:  [/(\/\*[\s\S]*?\*\/)|("[^"]*"|'[^']*')|(@[\w-]+|[.#][a-zA-Z_][\w-]*)|(--[\w-]+|[a-z-]+(?=\s*:))|(#[0-9a-fA-F]{3,8}\b|\b\d*\.?\d+(?:px|rem|em|vw|vh|deg|s|ms|%)?)/g, ['c','s','t','p','n']],
  js:   [/(\/\/.*|\/\*[\s\S]*?\*\/)|(`[^`]*`|"[^"]*"|'[^']*')|\b(const|let|var|function|return|if|else|new|try|catch|true|false|document|window)\b|(\b\d+\.?\d*\b)|(\b[a-zA-Z_$][\w$]*(?=\())/g, ['c','s','k','n','f']]
};
function hl(code, lang){
  const [re, cls] = RULES[lang]; let out = '', last = 0;
  code.replace(re, (m, ...g) => {
    const off = g[g.length-2]; const i = g.slice(0, cls.length).findIndex(x => x !== undefined);
    out += esc(code.slice(last, off)) + '<span class="'+cls[i]+'">'+esc(m)+'</span>'; last = off + m.length; return m;
  });
  return out + esc(code.slice(last));
}
let cur = 'html';
function show(t){
  cur = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.getElementById('code').innerHTML = hl(SRC[t], t);
  document.getElementById('file').textContent = FILES[t];
  document.getElementById('wrap').scrollTop = 0;
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => show(b.dataset.t)));
document.getElementById('copy').addEventListener('click', e => {
  navigator.clipboard && navigator.clipboard.writeText(SRC[cur]).then(() => {
    e.target.textContent = 'Copied ✓'; setTimeout(() => e.target.textContent = 'Copy', 1400);
  });
});
show('html');
</script>
</body>
</html>
